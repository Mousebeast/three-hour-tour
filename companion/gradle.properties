org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

minecraft_version=1.21.1
neo_version=21.1.248
sable_version=2.0.5
kubejs_version=2101.7.2-build.374

mod_id=threehourtour
mod_version=1.0.1
mod_group_id=com.mousebeast.threehourtour

# Jars supplied by the staged 3ht server, not published to any Maven repo.
# compileOnly at build time - never bundled into the mod jar. A fresh clone
# needs read access to this directory (or these three properties repointed
# at a local copy of the matching versions) before `./gradlew build` works.
staged_mods_dir=/srv/minecraft/3ht/mods
sable_jar_file=sable-neoforge-1.21.1-2.0.5.jar
kubejs_jar_file=kubejs-neoforge-2101.7.2-build.374.jar
# Pinned to build.85, not the newer build.91 that also satisfies KubeJS's
# declared range - this deliberately matches the owner's installed client
# (see docs/mod-audit.md, Rhino entry).
rhino_jar_file=rhino-2101.2.7-build.85.jar

# FTB Teams answers "are these two players on the same team?" for the core's
# access rule. ftb-library comes with it because TeamManager's signatures
# reference it (Color4I). Optional at runtime; compileOnly here.
ftbteams_jar_file=ftb-teams-neoforge-2101.1.11.jar
ftblibrary_jar_file=ftb-library-neoforge-2101.1.35.jar
ftbquests_jar_file=ftb-quests-neoforge-2101.1.34.jar

gateways_jar_file=GatewaysToEternity-1.21.1-5.1.0.jar
placebo_jar_file=Placebo-1.21.1-9.9.2.jar
guideme_jar_file=guideme-21.1.17.jar
